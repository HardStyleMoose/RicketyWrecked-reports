name: Reports

on:
  issues:
    types: [opened, labeled, reopened, closed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency: { group: reports, cancel-in-progress: false }

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
      contents: read
    outputs:
      discord: ${{ steps.triage.outputs.discord }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: triage
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { run } = require('./.github/scripts/reports.js');
            await run({ github, context, core, fetch });

  # Posts after triage, so a duplicate says "seen again" instead of looking new.
  # A separate job with no token: only it gets the webhook, and only the message
  # built and cleaned by reports.js, never the report itself.
  discord:
    needs: reports
    if: ${{ !cancelled() && needs.reports.outputs.discord != '' }}
    permissions: {}
    uses: ./.github/workflows/discord.yml
    with:
      message: ${{ needs.reports.outputs.discord }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
