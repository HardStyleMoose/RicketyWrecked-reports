name: Reports

on:
  issues:
    types: [opened, labeled, reopened, closed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  reports:
    # The relay adds labels as it files a report. Those events do nothing, and in a queue they'd
    # replace the waiting run for a new report, so they don't queue at all. fixed-in: labels do.
    if: github.event.action != 'labeled' || startsWith(github.event.label.name, 'fixed-in:')
    concurrency: { group: reports, cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { run } = require('./.github/scripts/reports.js');
            await run({ github, context, core, fetch });
